<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      font-family: Segoe UI, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 14px;
    }
    h3 {
      font-size: 13px;
      margin-top: 0;
      color: #f0b90b;
      margin-bottom: 8px;
    }
    .status-badge {
      background: #10b981;
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 12px;
      font-weight: 600;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
      margin: 4px 0 12px 0;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <h3>⚡ News Sniper Status</h3>
  <span class="status-badge">Active & Monitoring</span>
  <p>Overlay is automatically attached to TradingView, XM, and FBS charts. Alerts trigger immediately on release.</p>
</body>
</html>
